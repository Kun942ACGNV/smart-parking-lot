[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-parking-lot"
version = "0.1.0"
description = "智慧停車場：以資料結構為架構的停車管理系統"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
parking = "parking.cli:main"

[tool.setuptools]
packages = ["parking"]
